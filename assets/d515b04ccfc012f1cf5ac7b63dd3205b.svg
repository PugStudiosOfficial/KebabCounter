<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="157.06287" height="206.40972" viewBox="0,0,157.06287,206.40972"><g transform="translate(-20.10662,-92.53414)"><g fill="#000000" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-size="40"><text transform="translate(20.63005,106.09744) scale(0.3118,0.3118)" font-size="40" xml:space="preserve" fill="#000000" font-weight="400"><tspan x="0" dy="0">A new version is available!</tspan></text><text transform="translate(24.70009,149.77841) scale(0.23808,0.23808)" font-size="40" xml:space="preserve" fill="#000000" font-weight="400"><tspan x="0" dy="0">We have released an update</tspan><tspan x="0" dy="46.150000000000006px">to Kebab Counter, we highly</tspan><tspan x="0" dy="46.150000000000006px">recommend keeping the app</tspan><tspan x="0" dy="46.150000000000006px">up to date to enjoy new features</tspan><tspan x="0" dy="46.150000000000006px">and bug fixes.</tspan><tspan x="0" dy="46.150000000000006px">Enjoy Kebab Counter! ^^</tspan></text><text transform="translate(20.24255,257.90659) scale(0.27186,0.27186)" font-size="40" xml:space="preserve" fill="#000000" font-weight="normal"><tspan x="0" dy="0">Go to the PugStore</tspan><tspan x="0" dy="46.150000000000006px">(sites.google.com/view/</tspan><tspan x="0" dy="46.150000000000006px">pugstore-official) to download</tspan><tspan x="0" dy="46.150000000000006px">the update.</tspan></text></g></g></svg>